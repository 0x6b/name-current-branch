[package]
name = "name-current-branch"
version = "0.3.0"
edition = "2024"
description = "A CLI tool that automatically generates meaningful git branch names using Claude Code"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
git2 = "0.20.2"
indicatif = "0.18.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"

[profile.dev]
lto = true
codegen-units = 1
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
